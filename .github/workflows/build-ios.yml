name: Build and Release iOS IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Devil May Cry 4 iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Tools
        run: |
          brew install cmake ninja

      - name: Prepare SDK & Dependencies
        run: |
          python3 tools/prepare_sdk.py

      - name: Optional Ahead-of-Time Code Generation
        run: |
          if [ -f "game/default.xex" ]; then
            python3 tools/generate_code.py --xex game/default.xex
          else
            echo "[*] No pre-committed default.xex found. Using dynamic runtime loader..."
          fi

      - name: Configure CMake for iOS (ARM64)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDMC4_ENABLE_PROMOTION=ON \
            -DDMC4_ENABLE_TOUCH=ON \
            -DDMC4_BUILD_IPA=OFF

      - name: Build App
        run: |
          cmake --build build --config Release

      - name: Package Sideloadable IPA
        run: |
          APP_PATH=$(find build -name "DevilMayCry4.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          fi
          echo "[+] Found application bundle at: $APP_PATH"

          # 1. Compile Assets catalog if actool is available, else copy icons directly
          if command -v xcrun &> /dev/null && [ -d "ios/Assets.xcassets" ]; then
            echo "[+] Compiling asset catalog with actool..."
            xcrun actool ios/Assets.xcassets \
              --compile "$APP_PATH" \
              --platform iphoneos \
              --minimum-deployment-target 16.0 \
              --target-device iphone --target-device ipad \
              --app-icon AppIcon \
              --output-format human-readable-text || true
          fi
          echo "[+] Bundling DMC4 iOS App Icons..."
          cp -v ios/AppIcon*.png "$APP_PATH/" || true
          cp -r ios/AppIcon.appiconset "$APP_PATH/" || true

          # 2. Embed MoltenVK Framework if present
          mkdir -p "$APP_PATH/Frameworks"
          MVK_FRAMEWORK=$(find libs -name "MoltenVK.framework" -type d | grep "ios" | head -n 1)
          if [ -n "$MVK_FRAMEWORK" ]; then
            echo "[+] Embedding MoltenVK framework from $MVK_FRAMEWORK..."
            cp -r "$MVK_FRAMEWORK" "$APP_PATH/Frameworks/"
          fi

          # 3. Strip extended attributes, fix permissions, and sign for sideloading
          echo "[+] Clearing extended attributes and fixing executable permissions..."
          xattr -cr "$APP_PATH" || true
          chmod -R 755 "$APP_PATH"
          chmod +x "$APP_PATH/DevilMayCry4"

          # Sign inner frameworks if present
          if [ -d "$APP_PATH/Frameworks/MoltenVK.framework" ]; then
            echo "[+] Ad-hoc signing MoltenVK framework..."
            codesign --force --sign - --timestamp=none "$APP_PATH/Frameworks/MoltenVK.framework" || true
          fi

          # Sign the main application bundle with entitlements
          echo "[+] Ad-hoc signing DevilMayCry4.app with entitlements..."
          codesign --force --sign - --timestamp=none --entitlements ios/dmc4.entitlements "$APP_PATH" || true

          # 4. Create Payload directory cleanly and zip to IPA
          rm -rf build/Payload build/DevilMayCry4.ipa
          mkdir -p build/Payload
          cp -a "$APP_PATH" build/Payload/DevilMayCry4.app
          cd build
          zip -r -y -q DevilMayCry4.ipa Payload
          cd ..
          ls -lh build/DevilMayCry4.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevilMayCry4-iOS-IPA
          path: build/DevilMayCry4.ipa
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "[*] Release $TAG already exists, uploading new IPA..."
            gh release upload "$TAG" build/DevilMayCry4.ipa --clobber
          else
            echo "[*] Creating new GitHub Release $TAG..."
            gh release create "$TAG" build/DevilMayCry4.ipa \
              --title "Devil May Cry 4 iOS v1.0.0" \
              --notes "### Devil May Cry 4 (Xbox 360) Native iOS Port
          
          Native Apple Silicon ARM64 static recompilation port for iPhone and iPad.
          
          #### Key Features:
          - **Zero-Hassle Auto File Discovery**: Automatically detects game files placed in \`Files App > On My iPhone > Devil May Cry 4 > game/\`. No file picker dialog required!
          - **Custom DMC Combat Touch HUD**: Styled after Devil May Cry 4 with custom icons for Melee Sword [Y], Handgun [X], Devil Bringer Buster [B], Jump [A], Lock-On Target Reticle [RB], and Devil Trigger [LB].
          - **Apple ProMotion (120 Hz)**: Full 120 FPS high-refresh rate support with physics delta scaling.
          - **Controller Support**: Full native support for MFi, PlayStation DualSense/DualShock 4, and Xbox Wireless controllers.
          
          #### How to Play:
          1. Sideload \`DevilMayCry4.ipa\` via LiveContainer, SideStore, AltStore, or TrollStore.
          2. Open the app once to initialize documents directory.
          3. Copy your DMC4 Xbox 360 ISO, ZIP, or extracted game folder into \`Files App > On My iPhone > Devil May Cry 4 > game/\`.
          4. Open the app and press **⚔ PLAY**!"
          fi
